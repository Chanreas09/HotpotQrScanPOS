name: Send Order to Telegram

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Order message to send'
        required: true
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send to Telegram
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{"chat_id": "${{ secrets.CHAT_ID }}", "text": "${{ github.event.inputs.message }}", "parse_mode": "HTML"}' \
            https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage
